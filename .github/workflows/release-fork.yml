name: Build fork release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  linux-build:
    name: Linux build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source code
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install build deps
        run: sudo apt-get update && sudo apt-get install -y curl xz-utils build-essential git pkg-config libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev libgl1-mesa-dev libxkbcommon-x11-dev libfontconfig-dev libx11-xcb-dev libdbus-1-dev

      - name: Install Go
        uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod

      - name: Build kitty
        run: ./dev.sh build

      - name: Make launcher binaries relocatable
        run: |
          set -e
          # ./dev.sh build bakes the CI runner's own absolute build path in as
          # PYTHONHOME, so the binaries only work if run from that exact path.
          # Wrap them in a script that computes PYTHONHOME relative to the
          # binary's own location instead, so the archive works wherever it's
          # extracted.
          for bin in kitty kitten; do
            mv "kitty/launcher/$bin" "kitty/launcher/$bin.bin"
            printf '#!/bin/sh\nSELF_DIR=$(CDPATH= cd -- "$(dirname -- "$0")" && pwd)\nexport PYTHONHOME="$SELF_DIR/../../dependencies/linux-amd64"\nexec "$SELF_DIR/%s.bin" "$@"\n' "$bin" > "kitty/launcher/$bin"
            chmod +x "kitty/launcher/$bin"
          done

      - name: Package
        id: package
        run: |
          set -e
          if [ "${GITHUB_REF_TYPE:-}" = "tag" ]; then
            TAG="${GITHUB_REF_NAME}"
          else
            TAG="build-$(date +%Y%m%d%H%M%S)-$(git rev-parse --short HEAD)"
          fi
          ARCHIVE="kitty-fork-linux-x86_64-${TAG}.tar.xz"
          tar -cJf "/tmp/$ARCHIVE" --exclude=.git --exclude="*.o" --exclude="*.d" .
          mv "/tmp/$ARCHIVE" "$ARCHIVE"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "archive=$ARCHIVE" >> "$GITHUB_OUTPUT"

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          gh release create "${{ steps.package.outputs.tag }}" \
            "${{ steps.package.outputs.archive }}" \
            --repo "${{ github.repository }}" \
            --title "${{ steps.package.outputs.tag }}" \
            --notes "Automated build from commit ${{ github.sha }}." \
            --prerelease
